name: Session proposal
description: Propose a customer-facing Build Guild gathering.
title: "Session proposal: "
body:
  - type: textarea
    id: outcome
    attributes:
      label: Public topic and summary
      description: What will attendees learn or discuss?
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Intended audience
      description: Who should attend, and is any prior experience needed?
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Proposed format
      options:
        - workshop
        - deep-dive
        - showcase
        - discussion
  - type: textarea
    id: exercise
    attributes:
      label: High-level agenda and proposed timing
      description: Outline the public agenda and include a proposed date/time zone if known.
    validations:
      required: true
  - type: textarea
    id: resources
    attributes:
      label: Public resources
      description: Link optional public resources. Do not upload private materials, credentials, or attendee data.
